[project]
name = "myapp"
version = "0.1.0"
description = "WonderTrader Python 量化交易应用"
requires-python = ">=3.8"
dependencies = [
    # 核心框架
    "wtpy>=0.9.9.3",
    
    # 核心依赖
    # 注意：pandas 1.3.5 需要 numpy < 1.24.0
    "numpy>=1.20.0,<1.24.0",
    "pandas==1.3.5",
    "pyyaml>=5.4.0",
    "fire>=0.5.0",
    
    # 数据下载相关
    "baostock>=0.8.8",
    
    # wtpy 相关依赖
    "chardet>=4.0.0",
    "xlsxwriter>=3.0.0",
    "psutil>=5.8.0",
    
    # 进度条
    "tqdm>=4.65.0",
]

[project.scripts]
myapp = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
